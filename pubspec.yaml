name: rafiq_app
description: تطبيق رَفِيق للقرآن الكريم والحفظ والمراجعة
publish_to: 'none'
version: 0.4.10+15

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  # EXACT pin on purpose. 10.3.11+, 11.x skip the Kotlin plugin on AGP 9 and
  # expect built-in Kotlin, but Flutter 3.47 projects keep
  # android.builtInKotlin=false (record_android still applies KGP), so
  # FilePickerPlugin.kt is never compiled and the APK build fails with
  # "cannot find symbol: class FilePickerPlugin". 10.3.10 applies KGP itself.
  file_picker: 10.3.10
  crypto: ^3.0.6
  flutter_local_notifications: 17.2.2
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  # Keep 6.2.x: record 5.2.1 can resolve record_linux 0.7.2 alongside
  # record_platform_interface 1.6.0, which is source-incompatible.
  record: ^6.2.1
  sherpa_onnx: ^1.13.8
  sqflite: ^2.4.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
